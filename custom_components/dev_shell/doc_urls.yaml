# help(obj) documents an object's *type*, which isn't very discoverable for core
# Home Assistant classes - there's no narrative docstring pointing you at the real
# developer docs. This maps a class's fully-qualified name ("<module>.<qualname>",
# exactly as session.py computes it from type(obj)) to the page that documents it.
#
# Entries here are shown as a "See also:" line appended to help()'s output.

homeassistant.core.HomeAssistant: https://developers.home-assistant.io/docs/dev_101_hass
homeassistant.helpers.entity.Entity: https://developers.home-assistant.io/docs/core/entity
homeassistant.helpers.entity_registry.EntityRegistry: https://developers.home-assistant.io/docs/entity_registry_index
