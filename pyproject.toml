[project]
name = "dev_shell"
version = "0.1.0"
description = "Developer shell for Home Assistant, for REPL style access to running Home Assistant instances"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "prompt-toolkit>=3.0",
    "pygments>=2.18",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "websockets>=13.0",
]


[project.scripts]
dev_shell = "dev_shell.cli:main"

[dependency-groups]
dev = [
    "homeassistant",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.0",
    "pre-commit>=4.4.0",
    "pytest>=9.0.0",
    "pytest-mock>=3.15.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist",
    "pytest-timeout",
    "coverage",
    "icdiff",
    "genbadge[all]",
    "actionlint-py",
    "codespell",
    "mypy",
]
docs=[
    "properdocs",
    "mkdocs-materialx",
    "mkdocs-minify-plugin",
    "mkdocs-autorefs",
    "mkdocs-pagetree-plugin",
    "mkdocs-coverage",
    "pymdown-extensions",
    "mkdocs-meta-descriptions-plugin",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-htmlproofer-plugin",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_shell"]

[tool.ruff.lint]
preview = true
unfixable = ["B"]


[tool.ruff.format]
preview = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [
    ".git",
    "templates",
]
addopts = [
    "--timeout=30",
    "--cov-report=xml:cov.xml",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov=custom_components/dev_shell_server",
    "--cov-fail-under=35",  # TODO: raise back towards 90 once hass-backed tests land
]

[tool.mypy]
mypy_path = "src"

[tool.codespell]
skip = ".venv,.git,htmlcov,site/**,./.*,*.csv,*.json,README.*.md,support"
count = true
quiet-level = 2
ignore-words-list="hass,referer"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B105"]