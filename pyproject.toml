[project]
name = "dev_shell"
version = "0.1.0"
description = "Developer shell for Home Assistant, for REPL style access to running Home Assistant instances"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prompt-toolkit>=3.0",
    "pygments>=2.18",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "websockets>=13.0",
]

[project.scripts]
dev_shell = "dev_shell.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
# The original marimo exploration notebook (home_assistant_entity_notebook.py).
notebook = [
    "altair>=5.4.1",
    "homeassistant-api>=4.2.2.post2",
    "marimo>=0.8.18",
    "polars>=1.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_shell"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
