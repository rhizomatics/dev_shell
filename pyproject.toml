[project]
name = "homeassistant-repl"
version = "0.2.0"
description = "Home Assistant REPL - the powerful developer shell for custom component developers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "homeassistant-api>=6.1.0",
    "niquests[ws]>=3.21.0",
    "prompt-toolkit>=3.0",
    "pygments>=2.18",
    "pyyaml>=6.0",
    "rich>=15.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Debuggers",
    "Intended Audience :: Developers",
    "Typing :: Typed",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14"
]

[project.scripts]
ha-repl = "homeassistant_repl.cli:main"

[dependency-groups]
dev = [
    "homeassistant",
    "types-Pygments",
    "pytest-homeassistant-custom-component",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.0",
    "pre-commit>=4.4.0",
    "pytest>=9.0.0",
    "pytest-mock>=3.15.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist",
    "pytest-timeout",
    "coverage",
    "icdiff",
    "genbadge[all]",
    "actionlint-py",
    "codespell",
    "mypy",
    "niquests-mock>=0.5.1,<0.6.0",
]
docs=[
    "properdocs",
    "mkdocs-materialx",
    "mkdocs-minify-plugin",
    "mkdocs-autorefs",
    "mkdocs-pagetree-plugin",
    "mkdocs-coverage",
    "termynal",
    "mkdocs-homepage-copier",
    "pymdown-extensions",
    "mkdocs-meta-descriptions-plugin",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-htmlproofer-plugin",
    "mkdocs-llmstxt>=0.5.0,<0.6.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
compile-bytecode = true
managed = true
exclude-newer = "7 days"
exclude-newer-package = {"uv_build"="2 days"}
add-bounds = "major"

[tool.uv.build-backend]
module-root = "src"
module-name = "homeassistant_repl"


[tool.ruff.lint]
preview = true
unfixable = ["B"]


[tool.ruff.format]
preview = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [
    ".git",
    "templates",
]
addopts = [
    "--timeout=30",
    "--junitxml=junit/test-results.xml",
    "--cov-report=xml:cov.xml",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov=custom_components/ha_repl_server",
    "--cov=src",
    "--cov-fail-under=45",  # TODO: raise back towards 90 once hass-backed tests land
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under=0

[tool.coverage.xml]
output="cov.xml"

[tool.coverage.html]
directory="htmlcov"

[tool.mypy]
mypy_path = "src"

[tool.codespell]
skip = ".venv,.git,htmlcov,site/**,./.*,*.csv,*.json,README.*.md,support"
count = true
quiet-level = 2
ignore-words-list="hass,referer"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B105"]

[project.urls]
Homepage="https://homeassistant-repl.rhizomatics.org.uk"
Repository="https://github.com/rhizomatics/homeassistant-repl"
Documentation="https://homeassistant-repl.rhizomatics.org.uk"
Issues="https://github.com/rhizomatics/homeassistant-repl/issues"
Changelog="https://github.com/rhizomatics/homeassistant-repl/blob/main/CHANGELOG.md"
