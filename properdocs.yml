site_name: Home Assistant REPL
site_url: https://homeassistant-repl.rhizomatics.org.uk
site_description: Python REPL Shell for Home Assistant Developers

repo_name: rhizomatics/homeassistant-repl
repo_url: https://github.com/rhizomatics/homeassistant-repl
edit_uri: edit/main/docs/
docs_dir: docs
#watch:
#  - README.md
#  - CHANGELOG.md

theme:
  name: materialx
  custom_dir: overrides
  highlightjs: true
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search
    - search.share
    - toc.follow
    - toc.integrate
hooks:
  # heading anchors match GitHub (incl. non-ASCII), so translated README links work
  - docs_hooks/slugs.py
  - docs_hooks/llmstxt_hooks.py

plugins:
  - search
  - termynal:
      include_assets: true
      prompt_literal_start:
        - '$'
        - '>>>'
  - autorefs
  - mkdocs-homepage-copier:
      extras:
        - src: CHANGELOG.md
          dest: docs/changelog.md
          copy: true

  - pagetree
  - meta-descriptions
  - tags
  - htmlproofer:
      skip_downloads: True
  - llmstxt:
      full_output: llms-full.txt
      preprocess: docs_hooks/llmstxt_preprocess.py
      markdown_description: >
        Home Assistant REPL is a Python shell for developers of Home Assistant custom components. It
        exposes the live object tree - entities and more - as a dict-like `obj`, for exploring
        APIs, trying out code snippets and hotfixing issues directly against a running Home
        Assistant instance. `api` mode uses only the standard Home Assistant HTTP/WebSocket API;
        an optional `custom` mode, via a HACS companion component, adds direct access to the
        core Python API as `hass`.
      sections:
        Start here:
          - index.md: Overview of what Home Assistant REPL does, api vs custom mode, and getting started
        # changelog and roadmap left out - old or planned behaviour an agent would take as current
  #- minify:
  #    minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
  - coverage:
      page_path: developer/coverage
      html_report_dir: htmlcov

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.critic
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true
  - sane_lists
  #- pymdownx.snippets:
  #    check_paths: true
