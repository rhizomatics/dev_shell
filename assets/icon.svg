<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- A thick slice of cherry pie, crust to the left, tip to the right - drawn in
       the chunky flat-shaded style of an early-90s (Visual Basic 3) icon: hard
       2px outlines, no gradients/blur, a front "cut face" wall to show it's a
       solid wedge rather than a flat (pizza-like) top-down shape. -->

  <!-- ground shadow -->
  <ellipse cx="28" cy="62" rx="22" ry="3.5" fill="#000000" opacity="0.18"/>

  <!-- front cut-face wall (the slice's cross-section: crust then filling) -->
  <path d="M 50.0,30.0 L 12.0,46.0 L 12.0,59.0 L 50.0,43.0 Z"
        fill="#C23B4B" stroke="#3B2412" stroke-width="2.5" stroke-linejoin="miter"/>
  <path d="M 50.0,39.1 L 12.0,55.1 L 12.0,59.0 L 50.0,43.0 Z"
        fill="#D2A054" stroke="#3B2412" stroke-width="2.5" stroke-linejoin="miter"/>

  <!-- crust rim bulge along the left edge -->
  <path d="M 12.0,8.0 L 12.0,46.0 L 8.0,46.0 L 8.0,8.0 Z"
        fill="#D2A054" stroke="#3B2412" stroke-width="2.5" stroke-linejoin="miter"/>

  <!-- top surface (filling exposed) -->
  <path d="M 50.0,30.0 L 12.0,46.0 L 12.0,8.0 Z"
        fill="#C23B4B" stroke="#3B2412" stroke-width="2.5" stroke-linejoin="miter"/>

  <!-- berries baked into the top -->
  <circle cx="30" cy="20" r="3.2" fill="#7A1F2B" stroke="#3B2412" stroke-width="1.2"/>
  <circle cx="28.7" cy="18.7" r="0.9" fill="#E8A3AD"/>
  <circle cx="24" cy="30" r="3.0" fill="#7A1F2B" stroke="#3B2412" stroke-width="1.2"/>
  <circle cx="22.8" cy="28.8" r="0.9" fill="#E8A3AD"/>
  <circle cx="34" cy="34" r="2.6" fill="#7A1F2B" stroke="#3B2412" stroke-width="1.2"/>
  <circle cx="33" cy="33" r="0.8" fill="#E8A3AD"/>

  <!-- crimp marks down the crust rim -->
  <circle cx="10" cy="8" r="1.5" fill="#A67C3D"/>
  <circle cx="10" cy="15.6" r="1.5" fill="#A67C3D"/>
  <circle cx="10" cy="23.2" r="1.5" fill="#A67C3D"/>
  <circle cx="10" cy="30.8" r="1.5" fill="#A67C3D"/>
  <circle cx="10" cy="38.4" r="1.5" fill="#A67C3D"/>
  <circle cx="10" cy="46" r="1.5" fill="#A67C3D"/>

  <!-- hard specular highlight on the top surface, 90s-icon style (flat patch) -->
  <path d="M 12.0,8.0 L 12.0,20.0 L 23.0,14.0 Z" fill="#F08FA0"/>
</svg>
